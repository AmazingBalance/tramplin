name: Backend Container

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
    paths:
      - ".github/workflows/backend-container.yml"
      - "backend/**"
  pull_request:
    paths:
      - ".github/workflows/backend-container.yml"
      - "backend/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tramplin
          POSTGRES_PASSWORD: tramplin
          POSTGRES_DB: tramplin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tramplin -d tramplin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend

    env:
      TRAMPLIN_DATABASE_URL: postgres://tramplin:tramplin@127.0.0.1:5432/tramplin?sslmode=disable
      TRAMPLIN_OBJECT_STORAGE_ENDPOINT: 127.0.0.1:9000
      TRAMPLIN_OBJECT_STORAGE_PUBLIC_URL: http://127.0.0.1:9000
      TRAMPLIN_OBJECT_STORAGE_ACCESS_KEY: minioadmin
      TRAMPLIN_OBJECT_STORAGE_SECRET_KEY: minioadmin
      TRAMPLIN_OBJECT_STORAGE_BUCKET: tramplin-media
      TRAMPLIN_OBJECT_STORAGE_USE_SSL: "false"
      TRAMPLIN_OBJECT_STORAGE_REGION: us-east-1
      GOCACHE: /tmp/tramplin-go-build

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.sum

      - name: Start MinIO
        run: |
          docker run -d --name ci-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data

      - name: Wait for MinIO
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "minio did not become ready in time" >&2
          exit 1

      - name: Run Go tests
        run: go test ./...

      - name: Run integration tests
        run: go test -tags=integration ./tests/integration/...

      - name: Run real MinIO integration tests
        run: go test -tags='integration realminio' ./tests/integration/... -run 'RealMinIO'

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/tramplin-api
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
