    CompanyMembership:
      type: object
      description: >-
        Company membership record exposed to employers. Approved memberships grant company
        management access. Recommended MVP workflow: any approved member may invite another
        employer, which creates or reopens a pending membership; only owners may assign owner role
        or primary-contact status; managers may administer only non-owner memberships.
      required:
      - id
      - companyId
      - employerUserId
      - employer
      - company
      - membershipStatus
      - memberRole
      - isPrimaryContact
      - statusUpdatedAt
      - updatedAt
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
        employerUserId:
          type: string
          format: uuid
        employer:
          $ref: '#/components/schemas/EmployerPreview'
        invitedByUserId:
          type:
          - string
          - 'null'
          format: uuid
          description: Employer user who last created or reopened this membership invitation. Null for system-created memberships.
        company:
          $ref: '#/components/schemas/CompanySummary'
        membershipStatus:
          $ref: '#/components/schemas/CompanyMembershipStatus'
        memberRole:
          $ref: '#/components/schemas/CompanyMemberRole'
        isPrimaryContact:
          type: boolean
        statusChangedByUserId:
          type:
          - string
          - 'null'
          format: uuid
          description: User who most recently approved, rejected, revoked, or reopened the membership.
        statusComment:
          type:
          - string
          - 'null'
          description: Latest workflow note associated with invitation, rejection, approval, or revocation.
        statusUpdatedAt:
          type: string
          format: date-time
          description: Timestamp of the latest membership workflow state change.
        approvedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp when the membership was approved. Null means the membership has never been approved.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp of the latest change to the membership record, including role or primary-contact edits.
        createdAt:
          type: string
          format: date-time
    CreateCompanyMembershipRequest:
      type: object
      required:
      - employerEmail
      - memberRole
      properties:
        employerEmail:
          type: string
          format: email
        memberRole:
          $ref: '#/components/schemas/CompanyMemberRole'
        isPrimaryContact:
          type: boolean
          default: false
        comment:
          type:
          - string
          - 'null'
      description: Creates a pending company membership for an existing employer account resolved by email, or reopens a rejected/revoked membership for that employer.
    UpdateCompanyMembershipRequest:
      type: object
      properties:
        memberRole:
          $ref: '#/components/schemas/CompanyMemberRole'
        isPrimaryContact:
          type: boolean
      allOf:
      - anyOf:
        - required:
          - memberRole
        - required:
          - isPrimaryContact
      description: Updates an approved membership. Only owners may assign owner role or primary-contact status. Managers may edit only non-owner memberships and may assign only recruiter/hr/manager roles.
    ApproveCompanyMembershipRequest:
      type: object
      properties:
        comment:
          type:
          - string
          - 'null'
      description: Optional audit note recorded with the approval action.
    RejectCompanyMembershipRequest:
