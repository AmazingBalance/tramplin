openapi: 3.1.0
info:
  title: Tramplin API
  version: 5.4.0-draft
  summary: API for the "Трамплин" career platform
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: |
    Refined MVP contract between backend and frontend for the "Трамплин" platform.

    This revision aligns the API with `Tramplin.dbml` and the original technical specification.
    It keeps the role model, moderation flow, notifications, and location-aware public catalog,
    while correcting enum values and DTO shapes that had drifted from the data model.

    Key alignment points:
      - database-backed enum values are used consistently;
      - public company responses exclude verification-only fields;
      - saved entities and employer application flows expose stored metadata;
      - media metadata matches the `media_files` table, while access is derived from the entity a file is attached to.

    Authentication is implemented with stateless JWT tokens transported in HttpOnly cookies.
    Protected browser requests must be sent with credentials included.

    Curator administration invariant:
      - exactly one platform administrator exists at any time;
      - the administrator is also a curator and has all ordinary curator permissions;
      - only that administrator can create and manage other curator accounts;
      - creating a second administrator through public API is not supported.
servers:
- url: https://api.tramplin.example.com/v1
  description: Production
- url: http://localhost:8080/v1
  description: Local development
security:
- accessTokenCookie: []
tags:
- name: Auth
  description: Authentication, session, and current-user endpoints.
- name: Public
  description: Public catalog and anonymous lookup endpoints.
- name: Applicant
  description: Applicant profile, privacy, applications, and social activity endpoints.
- name: Employer
  description: Employer profile, company, opportunity, and hiring workflow endpoints.
- name: Curator
  description: Curator moderation, verification review, and privileged correction endpoints.
- name: Notifications
  description: Notification delivery, listing, and preference management endpoints.
- name: Uploads
  description: Media upload, metadata, deletion, and download access endpoints.
- name: Locations
  description: Normalized location search and creation endpoints.
- name: Admin
  description: Platform-administrator-only curator account management endpoints.
paths:
  /auth/register/applicant:
    post:
      tags:
      - Auth
      security: []
      summary: Register applicant account
      operationId: registerApplicant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterApplicantRequest'
      responses:
        '201':
          description: Applicant account created and auth cookies set
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/register/employer:
    post:
      tags:
      - Auth
      security: []
      summary: Register employer account
      operationId: registerEmployer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterEmployerRequest'
      responses:
        '201':
          description: Employer account created and auth cookies set
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/login:
    post:
      tags:
      - Auth
      security: []
      summary: Login by email and password
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Auth cookies set successfully
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Account is disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/refresh:
    post:
      tags:
      - Auth
      security:
      - refreshTokenCookie: []
      summary: Refresh auth cookies using refresh token cookie
      operationId: refreshToken
      responses:
        '200':
          description: New auth cookies set
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserResponse'
        '401':
          description: Refresh token is missing, invalid, expired, or revoked by token version change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/logout:
    post:
      tags:
      - Auth
      summary: Logout current browser session by clearing auth cookies
      operationId: logout
      description: Clears auth cookies only for the current browser session. This operation does not change users.token_version and does not invalidate other active sessions.
      responses:
        '204':
          description: Auth cookies cleared
          headers:
            Set-Cookie:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout-all:
    post:
      tags:
      - Auth
      summary: Invalidate all active tokens for current user
      operationId: logoutAll
      description: Backend increments users.token_version and clears current auth cookies. This invalidates all existing access and refresh tokens for the user across browsers and devices.
      responses:
        '204':
          description: All user tokens invalidated and current cookies cleared
          headers:
            Set-Cookie:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/me:
    get:
      tags:
      - Auth
      summary: Get authenticated user
      operationId: getMe
      responses:
        '200':
          description: Current authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /uploads/presign:
    post:
      tags:
      - Uploads
      summary: Create pre-signed upload URL for media file
      operationId: createPresignedUpload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePresignedUploadRequest'
      responses:
        '200':
          description: Upload instructions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignedUploadResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /uploads/{mediaFileId}/complete:
    post:
      tags:
      - Uploads
      summary: Finalize upload after client PUT to object storage
      operationId: completeUpload
      description: >-
        Client first uploads the binary file directly to object storage using the pre-signed PUT URL
        returned by /uploads/presign. After that it calls this endpoint so backend can verify that
        the object exists and finalize the upload record for later attachment to business entities.
        This operation is idempotent: repeating it for an already finalized file returns the same
        finalized media record.
      parameters:
      - $ref: '#/components/parameters/MediaFileId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteUploadRequest'
      responses:
        '200':
          description: Upload finalized or already finalized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaFile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: File was not uploaded or cannot be finalized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /media/{mediaFileId}:
    get:
      tags:
      - Uploads
      summary: Get media metadata
      operationId: getMediaFile
      description: >-
        Returns media metadata for an authenticated caller who is authorized to view the entity this
        file is attached to. Public pages should use the signed download URL flow instead of this
        metadata endpoint.
      parameters:
      - $ref: '#/components/parameters/MediaFileId'
      responses:
        '200':
          description: Media file metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaFile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - Uploads
      summary: Delete media file
      operationId: deleteMediaFile
      description: Marks the media file as deleted for the current authorized actor and prevents further use. Physical object removal may happen asynchronously. Deletion can be rejected while the file is still attached to an entity that forbids removal.
      parameters:
      - $ref: '#/components/parameters/MediaFileId'
      responses:
        '204':
          description: File deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: File is still attached to an entity that forbids deletion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /media/{mediaFileId}/download-url:
    post:
      tags:
      - Uploads
      security:
      - {}
      - accessTokenCookie: []
      summary: Create temporary signed download URL for media
      operationId: createMediaDownloadUrl
      description: >-
        Backend verifies access and returns a short-lived signed download URL for the requested file.
        Anonymous access is allowed only when the file is reachable through a public company or
        opportunity page. Otherwise the caller must be authenticated and authorized to view the
        entity this file is attached to.
      parameters:
      - $ref: '#/components/parameters/MediaFileId'
      responses:
        '200':
          description: Temporary download URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaDownloadUrlResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /public/opportunities:
    get:
      tags:
      - Public
      security: []
      summary: Search and filter publicly visible opportunities for list or map
      operationId: listPublicOpportunities
      description: |
        Returns only opportunities that are visible in the public catalog.

        In practice this means moderation_status=approved, publication rules are satisfied,
        and status in [planned, active]. Publication rules additionally require either
        publishedAt is null or publishedAt <= current server time.

        Query rules:
          - view=list is the default.
          - bbox, lat, lng, and radiusKm are allowed only when view=map.
          - city may be used in list or map mode, but in map mode it cannot be combined with bbox or center+radius filtering.
          - bbox cannot be combined with lat, lng, or radiusKm.
          - lat and lng must be provided together; if either is present then radiusKm is required.
          - employmentType, experienceLevel, salaryFrom, and salaryTo filter only vacancy and internship opportunities.
          - startsAfter filters only event and mentor_program opportunities that have a non-null startAt.
          - expiresAfter matches only opportunities whose expiresAt is non-null and greater than or equal to the provided timestamp.

        Sorting rules:
          - published_at_* sorts by publishedAt and falls back to createdAt desc for stable pagination.
          - salary_* places opportunities with salary data first and opportunities without salary data after them, then falls back to publishedAt desc.
          - starts_at_asc places entities with a meaningful startAt (events and mentor programs) first; entities without startAt are placed after them and secondarily sorted by publishedAt desc.

        Invalid parameter combinations must be rejected with 422 rather than silently ignored.
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/SearchQuery'
      - in: query
        name: type
        schema:
          $ref: '#/components/schemas/OpportunityType'
      - in: query
        name: participationFormat
        schema:
          $ref: '#/components/schemas/ParticipationFormat'
      - in: query
        name: employmentType
        schema:
          $ref: '#/components/schemas/EmploymentType'
      - in: query
        name: experienceLevel
        schema:
          $ref: '#/components/schemas/ExperienceLevel'
      - in: query
        name: companyId
        schema:
          type: string
          format: uuid
      - in: query
        name: city
        schema:
          type: string
      - in: query
        name: tagIds
        description: Repeated query parameter, for example ?tagIds=id1&tagIds=id2
        schema:
          type: array
          items:
            type: string
            format: uuid
        style: form
        explode: true
      - in: query
        name: salaryFrom
        schema:
          type: integer
      - in: query
        name: salaryTo
        schema:
          type: integer
      - in: query
        name: startsAfter
        schema:
          type: string
          format: date-time
      - in: query
        name: expiresAfter
        schema:
          type: string
          format: date-time
      - in: query
        name: sort
        schema:
          type: string
          enum:
          - published_at_desc
          - published_at_asc
          - salary_desc
          - salary_asc
          - starts_at_asc
      - in: query
        name: view
        schema:
          type: string
          enum:
          - list
          - map
          default: list
      - in: query
        name: bbox
        description: 'Bounding box for map mode: minLng,minLat,maxLng,maxLat'
        schema:
          type: string
      - in: query
        name: lat
        schema:
          type: number
          format: double
      - in: query
        name: lng
        schema:
          type: number
          format: double
      - in: query
        name: radiusKm
        schema:
          type: number
          format: double
          minimum: 0
      responses:
        '200':
          description: Opportunity list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPublicOpportunityCatalogItem'
        '422':
          $ref: '#/components/responses/ValidationError'
  /public/opportunities/{opportunityId}:
    get:
      tags:
      - Public
      security: []
      summary: Get public opportunity detail
      operationId: getPublicOpportunity
      description: Returns the public detail view only if the opportunity currently satisfies the same public-catalog visibility rules as /public/opportunities. Otherwise the endpoint returns 404.
      parameters:
      - $ref: '#/components/parameters/OpportunityId'
      responses:
        '200':
          description: Opportunity detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicOpportunityDetail'
        '404':
          $ref: '#/components/responses/NotFound'
  /public/companies:
    get:
      tags:
      - Public
      security: []
      summary: Search public companies
      operationId: listPublicCompanies
      description: Returns company profiles visible in the public catalog. In MVP, company profiles are public once created; verificationStatus is informational and does not itself hide a company from public listing. The optional q and city filters are free-text filters, and type is not exposed because companies are not categorized by role beyond their profile content.
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/SearchQuery'
      - in: query
        name: industry
        schema:
          type: string
      - in: query
        name: city
        schema:
          type: string
      responses:
        '200':
          description: Company list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCompanySummary'
        '422':
          $ref: '#/components/responses/ValidationError'
  /public/companies/{companyId}:
    get:
      tags:
      - Public
      security: []
      summary: Get public company detail
      operationId: getPublicCompany
      description: Returns the public company profile. In MVP, company detail is publicly available once the company record exists.
      parameters:
      - $ref: '#/components/parameters/CompanyId'
      responses:
        '200':
          description: Company detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyDetail'
        '404':
          $ref: '#/components/responses/NotFound'
  /public/tags:
    get:
      tags:
      - Public
      security: []
      summary: Get active tags for filters and forms
      operationId: listPublicTags
      description: Returns only tags where isActive=true. type is an exact tag-type filter. q is free-text search by tag name; matching strategy is implementation-defined but should be case-insensitive in normal user-facing implementations.
      parameters:
      - in: query
        name: type
        schema:
          $ref: '#/components/schemas/TagType'
      - $ref: '#/components/parameters/SearchQuery'
      responses:
        '200':
          description: Tag list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagListResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /me/ui-settings:
    get:
      tags:
      - Auth
      summary: Get UI settings for current user
      operationId: getMyUiSettings
      description: Available to any authenticated user role.
      responses:
        '200':
          description: UI settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserUiSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags:
      - Auth
      summary: Replace UI settings for current user
      operationId: putMyUiSettings
      description: Available to any authenticated user role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutUserUiSettingsRequest'
      responses:
        '200':
          description: Updated UI settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserUiSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /me/applicant-profile:
    get:
      tags:
      - Applicant
      summary: Get current applicant profile
      operationId: getMyApplicantProfile
      responses:
        '200':
          description: Applicant profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicantProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags:
      - Applicant
      summary: Update current applicant profile
      operationId: patchMyApplicantProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateApplicantProfileRequest'
      responses:
        '200':
          description: Applicant profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicantProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /me/applicant/privacy:
    get:
      tags:
      - Applicant
      summary: Get applicant privacy settings
      operationId: getMyApplicantPrivacy
      responses:
        '200':
          description: Privacy settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicantPrivacySettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags:
      - Applicant
      summary: Update applicant privacy settings
      operationId: patchMyApplicantPrivacy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateApplicantPrivacySettingsRequest'
      responses:
        '200':
          description: Privacy settings updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicantPrivacySettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /me/applicant/social-links:
    get:
      tags:
      - Applicant
      summary: List social links of current applicant
      operationId: listMyApplicantSocialLinks
      responses:
        '200':
          description: Social links
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicantSocialLinkListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Applicant
      summary: Add social link
      operationId: createMyApplicantSocialLink
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApplicantSocialLinkRequest'
      responses:
        '201':
          description: Social link created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicantSocialLink'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /me/applicant/social-links/{linkId}:
    delete:
      tags:
      - Applicant
      summary: Delete social link
      operationId: deleteMyApplicantSocialLink
      parameters:
      - $ref: '#/components/parameters/LinkId'
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Applicant
      summary: Update social link
      operationId: patchMyApplicantSocialLink
      parameters:
      - $ref: '#/components/parameters/LinkId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateApplicantSocialLinkRequest'
      responses:
        '200':
          description: Social link updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicantSocialLink'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /me/applicant/tags:
    get:
      tags:
      - Applicant
      summary: List current applicant tags
      operationId: listMyApplicantTags
      responses:
        '200':
          description: Applicant tags
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      description: Returns tags self-assigned by the current applicant.
    put:
      tags:
      - Applicant
      summary: Replace applicant tag set
      operationId: replaceMyApplicantTags
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceApplicantTagsRequest'
      responses:
        '200':
          description: Applicant tags updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
      description: Replaces the set of tags self-assigned by the current applicant.
  /me/applications:
    get:
      tags:
      - Applicant
      summary: List applications of current applicant
      operationId: listMyApplications
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - in: query
        name: status
        schema:
          $ref: '#/components/schemas/ApplicationStatus'
      responses:
        '200':
          description: Applications list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMyApplicationItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Applicant
      summary: Apply to opportunity
      operationId: createApplication
      description: "Business constraints:\n  - only applicant users can apply;\n  - only one application may ever exist per applicant/opportunity pair;\n  - target opportunity must be publicly available for applying;\n  - applicant cannot apply to closed, rejected, archived, or expired opportunity;\n  - application is created with status=submitted.\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApplicationRequest'
      responses:
        '201':
          description: Application submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Only applicants can apply or opportunity is not available for applying
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Applicant has already applied to this opportunity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
  /me/applications/{applicationId}:
    get:
      tags:
      - Applicant
      summary: Get application detail with history
