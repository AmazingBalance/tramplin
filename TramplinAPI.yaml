        sendViaInApp:
        - sendViaEmail
        sendViaEmail:
        - sendViaInApp
      properties:
        companyId:
          type: string
          format: uuid
        opportunityId:
          type:
          - string
          - 'null'
          format: uuid
        audienceType:
          $ref: '#/components/schemas/NotificationCampaignAudienceType'
        title:
          type: string
        body:
          type: string
        sendViaInApp:
          type: boolean
          default: true
        sendViaEmail:
          type: boolean
          default: false
        scheduledAt:
          type:
          - string
          - 'null'
          format: date-time
        applicantUserIds:
          type: array
          items:
            type: string
            format: uuid
      allOf:
      - oneOf:
        - type: object
          required:
          - audienceType
          - applicantUserIds
          properties:
            audienceType:
              type: string
              enum:
              - single_applicant
            applicantUserIds:
              type: array
              items:
                type: string
                format: uuid
              minItems: 1
              maxItems: 1
            opportunityId:
              type: 'null'
        - type: object
          required:
          - audienceType
          - applicantUserIds
          properties:
            audienceType:
              type: string
              enum:
              - selected_applicants
            applicantUserIds:
              type: array
              items:
                type: string
                format: uuid
              minItems: 1
            opportunityId:
              type: 'null'
        - type: object
          required:
          - audienceType
          - opportunityId
          properties:
            audienceType:
              type: string
              enum:
              - all_applicants_of_opportunity
            opportunityId:
              type: string
