        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Employer
      summary: Create company profile
      operationId: createEmployerCompany
      description: Creates a company profile and an initial approved owner membership for the current employer. That initial membership is also the primary contact by default.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompanyRequest'
      responses:
        '201':
          description: Company created
