          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: Available only to the single platform administrator. Updates a curator account. This endpoint cannot be used to create or assign another administrator. The sole platform administrator must always remain present; requests that would leave the system without an active administrator are rejected. The request must include an audit reason.
