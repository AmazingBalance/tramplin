      summary: List company memberships of current employer
      operationId: listEmployerCompanies
      description: >-
        Returns the current employer's company memberships. membershipStatus is derived from
        workflow state; only approved memberships grant company management access. Recommended MVP
        workflow: any approved member may create or reopen a pending invitation for another
        employer, while only owners may assign owner role or primary-contact status. Managers may
        approve, reject, revoke, or change only non-owner memberships.
      responses:
