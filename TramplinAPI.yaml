              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Employer
      summary: Update employer company
      operationId: patchEmployerCompany
      description: Updates company content for a company where the current employer has approved membership access.
      parameters:
      - $ref: '#/components/parameters/CompanyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCompanyRequest'
      responses:
        '200':
          description: Company updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployerCompanyDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Current employer has no access to this company
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /employer/companies/{companyId}/memberships:
    get:
      tags:
      - Employer
      summary: List company memberships
      operationId: listCompanyMemberships
      description: Returns the membership roster of a company where the current employer has approved membership access. Any approved member may view the current membership and invitation state.
      parameters:
      - $ref: '#/components/parameters/CompanyId'
      - in: query
        name: status
        schema:
          $ref: '#/components/schemas/CompanyMembershipStatus'
      responses:
        '200':
          description: Company memberships
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyMembershipListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Current employer has no access to membership administration for this company
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - Employer
      summary: Invite employer to company
      operationId: createCompanyMembership
      description: "Business constraints:\n  - current employer must have approved membership in the target company;\n  - target employer is resolved by employerEmail and must already have an employer account;\n  - any approved member may create a new pending membership or reopen a rejected/revoked membership;\n  - pending or approved membership for the same employer/company pair cannot be duplicated;\n  - only owners may invite directly into memberRole=owner or request isPrimaryContact=true;\n  - managers may invite only recruiter/hr/manager memberships.\n"
      parameters:
      - $ref: '#/components/parameters/CompanyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompanyMembershipRequest'
      responses:
        '200':
          description: Membership invitation created or reopened as pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyMembership'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Current employer cannot invite members to this company or requested role is not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Company or target employer account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Membership already exists in pending or approved state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
  /employer/companies/{companyId}/memberships/{membershipId}:
    patch:
      tags:
      - Employer
      summary: Update company membership role or primary contact
      operationId: patchCompanyMembership
      description: "Business constraints:\n  - current employer must have approved membership in the target company;\n  - target membership must belong to the specified company;\n  - only approved memberships may be edited through this endpoint;\n  - only owners may assign or remove memberRole=owner;\n  - managers may change only non-owner memberships and may assign only recruiter/hr/manager roles;\n  - only owners may set isPrimaryContact=true; setting it reassigns primary contact to the target membership.\n"
      parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/MembershipId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCompanyMembershipRequest'
      responses:
        '200':
          description: Membership updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyMembership'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Current employer cannot change this membership
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Requested change would violate membership lifecycle or owner invariants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
  /employer/companies/{companyId}/memberships/{membershipId}/approve:
    post:
      tags:
      - Employer
      summary: Approve company membership
      operationId: approveCompanyMembership
      description: "Business constraints:\n  - current employer must have approved membership in the target company;\n  - target membership must belong to the specified company and be pending;\n  - owners may approve any pending membership;\n  - managers may approve only non-owner memberships.\n"
      parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/MembershipId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveCompanyMembershipRequest'
      responses:
        '200':
          description: Membership approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyMembership'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Current employer cannot approve this membership
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Membership is not pending or approval would violate owner-role rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
  /employer/companies/{companyId}/memberships/{membershipId}/reject:
    post:
      tags:
      - Employer
      summary: Reject company membership
      operationId: rejectCompanyMembership
      description: "Business constraints:\n  - current employer must have approved membership in the target company;\n  - target membership must belong to the specified company and be pending;\n  - owners may reject any pending membership;\n  - managers may reject only non-owner memberships;\n  - comment is required for auditability.\n"
      parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/MembershipId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectCompanyMembershipRequest'
      responses:
        '200':
          description: Membership rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyMembership'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Current employer cannot reject this membership
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Membership is not pending or rejection would violate owner-role rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
  /employer/companies/{companyId}/memberships/{membershipId}/revoke:
    post:
      tags:
      - Employer
      summary: Revoke company membership
      operationId: revokeCompanyMembership
      description: "Business constraints:\n  - current employer must have approved membership in the target company;\n  - target membership must belong to the specified company and be approved;\n  - owners may revoke any approved membership, except the last approved owner membership;\n  - managers may revoke only non-owner memberships;\n  - comment is required for auditability.\n"
      parameters:
      - $ref: '#/components/parameters/CompanyId'
      - $ref: '#/components/parameters/MembershipId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeCompanyMembershipRequest'
      responses:
        '200':
          description: Membership revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyMembership'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Current employer cannot revoke this membership
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Membership is not approved or revocation would remove the last approved owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
  /employer/companies/{companyId}/verification-requests:
    get:
