        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
components:
  securitySchemes:
    accessTokenCookie:
      type: apiKey
      in: cookie
      name: tramplin_access_token
    refreshTokenCookie:
      type: apiKey
      in: cookie
      name: tramplin_refresh_token
  parameters:
    Page:
      in: query
      name: page
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      in: query
      name: pageSize
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    SearchQuery:
      in: query
      name: q
      schema:
        type: string
    OpportunityId:
      in: path
      name: opportunityId
      required: true
      schema:
        type: string
        format: uuid
    CompanyId:
      in: path
      name: companyId
      required: true
      schema:
        type: string
        format: uuid
    ApplicationId:
      in: path
      name: applicationId
      required: true
      schema:
        type: string
        format: uuid
    NotificationId:
      in: path
      name: notificationId
      required: true
      schema:
        type: string
        format: uuid
    CampaignId:
      in: path
      name: campaignId
      required: true
      schema:
        type: string
        format: uuid
    LinkId:
      in: path
      name: linkId
      required: true
      schema:
        type: string
        format: uuid
    ConnectionId:
      in: path
      name: connectionId
      required: true
      schema:
        type: string
        format: uuid
    MembershipId:
      in: path
      name: membershipId
      required: true
      schema:
        type: string
        format: uuid
    VerificationRequestId:
      in: path
      name: verificationRequestId
      required: true
      schema:
        type: string
        format: uuid
    ModerationCaseId:
      in: path
      name: moderationCaseId
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      in: path
      name: userId
      required: true
      schema:
        type: string
        format: uuid
    TagId:
      in: path
      name: tagId
      required: true
      schema:
        type: string
        format: uuid
    MediaId:
      in: path
      name: mediaId
      required: true
      schema:
        type: string
        format: uuid
    CompanySlug:
      in: path
      name: slug
      required: true
      schema:
        type: string
    OpportunitySlug:
      in: path
      name: slug
      required: true
      schema:
        type: string
    MediaFileId:
      in: path
      name: mediaFileId
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: Authentication failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Not enough permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Entity not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflict or duplicate entity
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    UserRole:
      type: string
      enum:
      - applicant
      - employer
      - curator
    ModeratedUserRole:
      type: string
      enum:
      - applicant
      - employer
    CompanyMemberRole:
      type: string
      description: >-
        Intended MVP permission model: owner has full company and membership administration rights
        and is the only role that may assign owner role or primary-contact status; manager may
        manage company content, opportunities, applications, campaigns, and administer non-owner
        memberships; hr and recruiter may manage ordinary company content, opportunities,
        applications, and campaigns, but may not finalize membership decisions or change other
        members' roles.
      enum:
      - owner
      - recruiter
      - hr
      - manager
    CompanyVerificationStatus:
      type: string
      enum:
      - pending
      - under_review
      - verified
      - rejected
      - expired
    CompanyMembershipStatus:
      type: string
      description: >-
        Intended MVP lifecycle: pending -> approved or rejected; approved -> revoked; rejected or
        revoked may later be moved back to pending when an approved company member re-invites the
        same employer to the company.
      enum:
      - pending
      - approved
      - rejected
      - revoked
    VerificationMethod:
      type: string
      enum:
      - corporate_email
      - inn
      - official_website
      - manual_review
    VerificationRequestStatus:
      type: string
      enum:
      - pending
      - under_review
      - approved
      - rejected
      - needs_changes
    OpportunityType:
      type: string
      enum:
      - internship
      - vacancy
      - mentor_program
      - event
    OpportunityStatus:
      type: string
      enum:
      - draft
      - planned
      - active
      - closed
      - rejected
      - archived
    ModerationStatus:
      type: string
      enum:
      - pending
      - approved
      - rejected
      - needs_changes
    ParticipationFormat:
      type: string
      enum:
      - offline
      - hybrid
      - remote
      - online
    EmploymentType:
      type: string
      enum:
      - full_time
      - part_time
      - project
      - contract
    ExperienceLevel:
      type: string
      enum:
      - trainee
      - junior
      - middle
      - senior
    ApplicationStatus:
      type: string
      enum:
      - submitted
      - reviewing
      - reserve
      - accepted
      - rejected
      - withdrawn
    ConnectionStatus:
      type: string
      enum:
      - pending
      - accepted
      - rejected
      - blocked
    MediaFileStatus:
      type: string
      enum:
      - pending
      - uploaded
      - failed
      - deleted
    MediaFilePurpose:
      type: string
      enum:
      - avatar
      - resume
      - company_logo
      - company_banner
      - company_media
      - opportunity_cover
      - opportunity_media
      - verification_evidence
      - other
    VisibilityScope:
      type: string
      enum:
      - private
      - contacts_only
      - employers_only
      - authenticated_public
    TagType:
      type: string
      enum:
      - technology
      - role
      - domain
      - level
      - employment_type
      - format
      - custom
    LinkType:
      type: string
      enum:
      - apply
      - info
      - registration
      - social
      - other
    ModerationTargetType:
      type: string
      enum:
      - company
      - profile
      - opportunity
      - tag
      - media
      - verification
    NotificationType:
      type: string
      enum:
      - recommendation_received
      - application_status_changed
      - employer_message
      - employer_broadcast
      - system
      description: Notification categories. employer_message and employer_broadcast are employer-originated notification events, not chat messages or threaded conversations.
    NotificationSourceType:
      type: string
      enum:
      - recommendation
      - application
      - campaign
      - system
    NotificationCampaignAudienceType:
      type: string
      enum:
      - single_applicant
      - selected_applicants
      - all_applicants_of_opportunity
    NotificationCampaignStatus:
      type: string
      enum:
      - draft
      - scheduled
      - processing
      - sent
      - cancelled
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    PaginationMeta:
      type: object
      required:
      - page
      - pageSize
      - totalItems
      - totalPages
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        totalItems:
          type: integer
        totalPages:
          type: integer
    TagListResponse:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
      description: Generic tag list response. In applicant profile contexts these are self-assigned applicant tags.
    SavedOpportunityListResponse:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SavedOpportunityItem'
    SavedCompanyListResponse:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SavedCompanyItem'
    CompanyMembershipListResponse:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CompanyMembership'
    ApplicantSocialLinkListResponse:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApplicantSocialLink'
    ConnectionListResponse:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Connection'
    VerificationRequestListResponse:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
