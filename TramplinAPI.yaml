    CreateOpportunityRequest:
      type: object
      required:
      - companyId
      - title
      - summary
      - slug
      - description
      - type
      - participationFormat
      properties:
        companyId:
          type: string
          format: uuid
        title:
          type: string
        summary:
          type: string
        slug:
          type: string
        description:
          type: string
        type:
          $ref: '#/components/schemas/OpportunityType'
        participationFormat:
          $ref: '#/components/schemas/ParticipationFormat'
        locationId:
          type:
          - string
          - 'null'
          format: uuid
        contactEmail:
          type:
          - string
          - 'null'
          format: email
        contactPhone:
          type:
          - string
          - 'null'
        coverMediaId:
          type:
          - string
          - 'null'
          format: uuid
        publishedAt:
          type:
          - string
          - 'null'
          format: date-time
        expiresAt:
          type:
          - string
          - 'null'
          format: date-time
        tagIds:
          type: array
          items:
            type: string
            format: uuid
        vacancyDetails:
          anyOf:
          - $ref: '#/components/schemas/OpportunityVacancyDetails'
          - type: 'null'
        mentorProgramDetails:
          anyOf:
          - $ref: '#/components/schemas/OpportunityMentorProgramDetails'
          - type: 'null'
        eventDetails:
          anyOf:
          - $ref: '#/components/schemas/OpportunityEventDetails'
          - type: 'null'
        links:
          type: array
          items:
            $ref: '#/components/schemas/OpportunityLinkInput'
        media:
          type: array
          items:
            $ref: '#/components/schemas/OpportunityMediaInput'
        location:
          anyOf:
          - $ref: '#/components/schemas/LocationInput'
          - type: 'null'
      allOf:
      - not:
          type: object
          required:
          - locationId
          - location
          properties:
            locationId: {}
            location: {}
      - if:
          required:
          - type
          properties:
            type:
              type: string
              enum:
              - internship
              - vacancy
        then:
          required:
          - vacancyDetails
          properties:
            vacancyDetails:
              not:
                type: 'null'
            mentorProgramDetails:
              type: 'null'
            eventDetails:
              type: 'null'
      - if:
          required:
          - type
          properties:
            type:
              type: string
              enum:
              - mentor_program
        then:
          required:
          - mentorProgramDetails
          properties:
            vacancyDetails:
              type: 'null'
            mentorProgramDetails:
              not:
                type: 'null'
            eventDetails:
              type: 'null'
      - if:
          required:
          - type
          properties:
            type:
              type: string
              enum:
              - event
        then:
          required:
          - eventDetails
          properties:
            vacancyDetails:
              type: 'null'
            mentorProgramDetails:
              type: 'null'
            eventDetails:
              not:
                type: 'null'
      description: 'Use either locationId to reference an existing normalized location or location to create/reuse one inline. Schema validation enforces that exactly one non-null opportunity detail block matches type: vacancy/internship -> vacancyDetails; mentor_program -> mentorProgramDetails; event -> eventDetails.'
