          - sendViaEmail
          properties:
            sendViaInApp:
              const: false
            sendViaEmail:
              const: false
      description: >-
        Audience constraints are enforced by schema.
        `single_applicant` requires exactly one applicantUserId;
        `selected_applicants` requires one or more applicantUserIds;
