      description: Available only to the single platform administrator. The platform administrator is also a curator and there can be exactly one such account in the system.
    post:
      tags:
      - Admin
      summary: Create non-admin curator account
      operationId: createAdminCurator
      description: Available only to the single platform administrator. Creates a non-admin curator account by creating both users and curator_profiles records. Creating another platform administrator through public API is not supported. The request must include an audit reason.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCuratorRequest'
      responses:
        '201':
