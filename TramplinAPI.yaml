          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
  /employer/opportunities/{opportunityId}:
    get:
      tags:
      - Employer
      summary: Get employer opportunity detail
      operationId: getEmployerOpportunity
      parameters:
      - $ref: '#/components/parameters/OpportunityId'
      responses:
        '200':
          description: Opportunity detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployerOpportunityDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Current employer has no access to this opportunity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Employer
      summary: Update opportunity
      operationId: patchEmployerOpportunity
      description: "Updates editable content of an employer opportunity.\nBusiness constraints for status transitions:\n  - draft -> planned, archived;\n  - planned -> active, archived;\n  - active -> closed, archived;\n  - closed -> archived;\n  - rejected -> draft, archived;\n  - archived is terminal.\n\nAdditional constraints:\n  - rejected is normally set by moderation workflow, not ordinary employer editing;\n  - active/planned opportunities intended for public catalog must have moderation_status=approved;\n  - changing type after creation is not supported in MVP;\n  - once moderation_status=approved, content fields are immutable in MVP;\n    only lifecycle actions such as activate/close/archive remain available.\n"
      parameters:
      - $ref: '#/components/parameters/OpportunityId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOpportunityRequest'
      responses:
        '200':
          description: Opportunity updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployerOpportunityDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Current employer has no access to this opportunity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Requested opportunity status transition is not allowed
          content:
