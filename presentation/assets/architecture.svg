<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fbf7ef"/>
      <stop offset="100%" stop-color="#f1e7d8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#1f2430" flood-opacity="0.10"/>
    </filter>
    <style>
      .title { font: 700 34px 'IBM Plex Sans', 'Segoe UI', sans-serif; fill: #182133; }
      .subtitle { font: 500 19px 'IBM Plex Sans', 'Segoe UI', sans-serif; fill: #5f6674; }
      .box-title { font: 700 26px 'IBM Plex Sans', 'Segoe UI', sans-serif; fill: #182133; }
      .label { font: 500 18px 'IBM Plex Sans', 'Segoe UI', sans-serif; fill: #425062; }
      .small { font: 500 16px 'IBM Plex Sans', 'Segoe UI', sans-serif; fill: #5f6674; }
      .chip { font: 700 15px 'IBM Plex Sans', 'Segoe UI', sans-serif; fill: white; }
    </style>
  </defs>

  <rect width="1600" height="900" rx="36" fill="url(#bg)"/>

  <text x="80" y="82" class="title">Архитектура backend-контура</text>
  <text x="80" y="118" class="subtitle">Стабильный API-контракт, изолированные доменные правила и раздельная работа с транзакционными данными и медиа.</text>

  <g filter="url(#shadow)">
    <rect x="92" y="214" width="308" height="190" rx="28" fill="#ffffff" stroke="#ddcfbe" stroke-width="3"/>
    <rect x="92" y="466" width="308" height="190" rx="28" fill="#ffffff" stroke="#ddcfbe" stroke-width="3"/>
    <rect x="478" y="170" width="430" height="520" rx="34" fill="#ffffff" stroke="#ddcfbe" stroke-width="3"/>
    <rect x="980" y="192" width="258" height="204" rx="28" fill="#ffffff" stroke="#ddcfbe" stroke-width="3"/>
    <rect x="980" y="448" width="258" height="204" rx="28" fill="#ffffff" stroke="#ddcfbe" stroke-width="3"/>
    <rect x="1292" y="214" width="220" height="130" rx="28" fill="#ffffff" stroke="#ddcfbe" stroke-width="3"/>
    <rect x="1292" y="394" width="220" height="130" rx="28" fill="#ffffff" stroke="#ddcfbe" stroke-width="3"/>
    <rect x="1292" y="574" width="220" height="130" rx="28" fill="#ffffff" stroke="#ddcfbe" stroke-width="3"/>
  </g>

  <rect x="112" y="236" width="92" height="34" rx="17" fill="#356b8c"/>
  <text x="132" y="259" class="chip">КЛИЕНТЫ</text>
  <text x="118" y="306" class="box-title">Web UI</text>
  <text x="118" y="344" class="label">• главная страница</text>
  <text x="118" y="376" class="label">• личные кабинеты</text>

  <rect x="112" y="488" width="114" height="34" rx="17" fill="#7c384c"/>
  <text x="132" y="511" class="chip">ИНТЕГРАЦИИ</text>
  <text x="118" y="558" class="box-title">Postman / QA</text>
  <text x="118" y="596" class="label">• тестирование API</text>
  <text x="118" y="628" class="label">• smoke и регрессия</text>

  <rect x="508" y="194" width="150" height="36" rx="18" fill="#b35c1e"/>
  <text x="539" y="218" class="chip">BACKEND API</text>
  <text x="514" y="280" class="box-title">Go service</text>
  <text x="514" y="322" class="label">• HTTP transport</text>
  <text x="514" y="354" class="label">• role-based access</text>
  <text x="514" y="386" class="label">• domain workflows</text>
  <text x="514" y="418" class="label">• validation и presenters</text>

  <text x="514" y="484" class="box-title">Ключевые домены</text>
  <text x="514" y="526" class="label">auth · applicant · company · opportunity</text>
  <text x="514" y="558" class="label">application · curation · notification</text>
  <text x="514" y="590" class="label">upload · location · tag</text>

  <text x="514" y="648" class="small">Контракт-first: OpenAPI описывает внешний API, а доменный слой удерживает инварианты.</text>

  <rect x="1002" y="214" width="92" height="34" rx="17" fill="#2f6a50"/>
  <text x="1025" y="237" class="chip">DATA</text>
  <text x="1006" y="286" class="box-title">PostgreSQL</text>
  <text x="1006" y="324" class="label">• пользователи и роли</text>
  <text x="1006" y="356" class="label">• возможности и отклики</text>
  <text x="1006" y="388" class="label">• уведомления, модерация</text>

  <rect x="1002" y="470" width="116" height="34" rx="17" fill="#356b8c"/>
  <text x="1023" y="493" class="chip">OBJECTS</text>
  <text x="1006" y="542" class="box-title">MinIO / S3</text>
  <text x="1006" y="580" class="label">• резюме и аватары</text>
  <text x="1006" y="612" class="label">• медиа компаний</text>
  <text x="1006" y="644" class="label">• presigned URL</text>

  <rect x="1312" y="236" width="94" height="34" rx="17" fill="#7c384c"/>
  <text x="1334" y="259" class="chip">CONTRACT</text>
  <text x="1316" y="310" class="box-title">OpenAPI</text>
  <text x="1316" y="338" class="small">TramplinAPI.yaml</text>

  <rect x="1312" y="416" width="76" height="34" rx="17" fill="#2f6a50"/>
  <text x="1337" y="439" class="chip">DATA</text>
  <text x="1316" y="490" class="box-title">DBML</text>
  <text x="1316" y="518" class="small">Tramplin.dbml</text>

  <rect x="1312" y="596" width="60" height="34" rx="17" fill="#b35c1e"/>
  <text x="1330" y="619" class="chip">CI</text>
  <text x="1316" y="670" class="box-title">Actions + GHCR</text>
  <text x="1316" y="698" class="small">тесты, build, publish</text>

  <path d="M400 308 C432 308, 446 308, 478 308" fill="none" stroke="#356b8c" stroke-width="6" stroke-linecap="round"/>
  <polygon points="468,294 493,308 468,322" fill="#356b8c"/>

  <path d="M400 560 C432 560, 446 560, 478 560" fill="none" stroke="#7c384c" stroke-width="6" stroke-linecap="round"/>
  <polygon points="468,546 493,560 468,574" fill="#7c384c"/>

  <path d="M908 304 C936 304, 952 304, 980 304" fill="none" stroke="#2f6a50" stroke-width="6" stroke-linecap="round"/>
  <polygon points="970,290 995,304 970,318" fill="#2f6a50"/>

  <path d="M908 560 C936 560, 952 560, 980 560" fill="none" stroke="#356b8c" stroke-width="6" stroke-linecap="round"/>
  <polygon points="970,546 995,560 970,574" fill="#356b8c"/>

  <path d="M1238 304 C1260 304, 1270 304, 1292 304" fill="none" stroke="#7c384c" stroke-width="5" stroke-linecap="round"/>
  <polygon points="1282,292 1304,304 1282,316" fill="#7c384c"/>

  <path d="M1238 548 C1260 548, 1270 548, 1292 548" fill="none" stroke="#b35c1e" stroke-width="5" stroke-linecap="round"/>
  <polygon points="1282,536 1304,548 1282,560" fill="#b35c1e"/>

  <path d="M1402 344 C1402 368, 1402 372, 1402 394" fill="none" stroke="#cdbda9" stroke-width="4" stroke-dasharray="10 10"/>
  <path d="M1402 524 C1402 548, 1402 552, 1402 574" fill="none" stroke="#cdbda9" stroke-width="4" stroke-dasharray="10 10"/>
</svg>
